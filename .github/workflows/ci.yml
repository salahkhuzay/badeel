name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: فحص الأنواع والبناء
    runs-on: ubuntu-latest

    steps:
      - name: سحب المستودع
        uses: actions/checkout@v4

      - name: تهيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: تثبيت الحزم
        run: npm ci

      - name: فحص الأنواع (TypeScript)
        run: npm run typecheck

      - name: بناء الإنتاج
        run: npm run build
